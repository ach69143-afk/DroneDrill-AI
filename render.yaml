# Render Infrastructure-as-Code (IaC) Blueprint
# Deploy: Connect this repo on https://dashboard.render.com → New → Blueprint
# Docs:  https://docs.render.com/infrastructure-as-code

services:
  - type: web
    name: dronedrill-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
    healthCheckPath: /health
